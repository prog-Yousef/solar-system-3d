renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.8;
document.body.appendChild(renderer.domElement);

// ── Controls ─────────────────────────────────────────────────────────────────
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 3;
controls.maxDistance = 350;
controls.target.set(0, 0, 0);

// ── Lighting ─────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x334466, 0.8));

sunLight.position.set(0, 0, 0);
scene.add(sunLight);

// ── Post-Processing ──────────────────────────────────────────────────────────
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.4, 0.4, 0.5
);
composer.addPass(bloomPass);

// ── Procedural Texture Helpers ────────────────────────────────────────────────
function createCanvasTexture(w, h, drawFn) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  drawFn(ctx, w, h);
  return new THREE.CanvasTexture(c);
}

function seededRandom(seed) {
  let s = seed;
  return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}

function noise(ctx, w, h, r, g, b, alpha, seed) {
  const img = ctx.createImageData(w, h);
  const rnd = seededRandom(seed);
  for (let i = 0; i < img.data.length; i += 4) {
    const n = rnd();
    img.data[i]     = r + (rnd() - 0.5) * 30 | 0;
    img.data[i + 1] = g + (rnd() - 0.5) * 30 | 0;
    img.data[i + 2] = b + (rnd() - 0.5) * 30 | 0;
    img.data[i + 3] = alpha;
  }
  ctx.putImageData(img, 0, 0);
}

// ── Procedural Planet Textures ────────────────────────────────────────────────
function mercuryTexture() {
  return createCanvasTexture(512, 256, (ctx, w, h) => {
    noise(ctx, w, h, 140, 126, 109, 255, 42);
    const rnd = seededRandom(99);
    for (let i = 0; i < 300; i++) {
      const x = rnd() * w, y = rnd() * h, rad = rnd() * 6 + 1;
      ctx.beginPath();
      ctx.arc(x, y, rad, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(60,55,50,${rnd() * 0.4 + 0.15})`;
      ctx.fill();
    }
  });
}

function venusTexture() {
  return createCanvasTexture(512, 256, (ctx, w, h) => {
    noise(ctx, w, h, 230, 200, 124, 255, 77);
    for (let y = 0; y < h; y += 2) {
      ctx.fillStyle = `rgba(${180 + Math.sin(y * 0.1) * 40},${160 + Math.cos(y * 0.08) * 30},80,0.15)`;
      ctx.fillRect(0, y, w, 3);
    }
    const rnd = seededRandom(201);
    for (let i = 0; i < 20; i++) {
      ctx.beginPath();
      ctx.arc(rnd() * w, rnd() * h, rnd() * 40 + 10, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200,170,90,${rnd() * 0.12 + 0.05})`;
      ctx.fill();
    }
  });
}

function earthTexture() {
  return createCanvasTexture(1024, 512, (ctx, w, h) => {
    // ocean
    ctx.fillStyle = '#2a5599';
    ctx.fillRect(0, 0, w, h);
    // landmasses (procedural continents)
    const rnd = seededRandom(314);
    const landColor = ['#4a7a3b','#3d6e2f','#5c8a48','#4d7c3a'];
    for (let i = 0; i < 18; i++) {
      const cx = rnd() * w, cy = rnd() * h;
      ctx.fillStyle = landColor[i % landColor.length];
      ctx.beginPath();
      const pts = 8 + (rnd() * 6 | 0);
      for (let p = 0; p < pts; p++) {
        const a = (p / pts) * Math.PI * 2;
        const rr = rnd() * 40 + 15;
        const px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr;
        p === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
    }
    // ice caps
    ctx.fillStyle = 'rgba(230,235,240,0.55)';
    ctx.fillRect(0, 0, w, 14);
    ctx.fillRect(0, h - 18, w, 18);
    // clouds
    for (let i = 0; i < 80; i++) {
      ctx.fillStyle = `rgba(255,255,255,${rnd() * 0.15 + 0.04})`;
      ctx.beginPath();
      ctx.ellipse(rnd() * w, rnd() * h, rnd() * 30 + 5, rnd() * 4 + 1, rnd() * Math.PI, 0, Math.PI * 2);
      ctx.fill();
    }
  });
}

function marsTexture() {
  return createCanvasTexture(512, 256, (ctx, w, h) => {
    noise(ctx, w, h, 193, 68, 14, 255, 55);
    // polar caps
    ctx.fillStyle = 'rgba(210,195,175,0.45)';
    ctx.fillRect(0, 0, w, 10);
    ctx.fillRect(0, h - 12, w, 12);
    // darker regions (maria)
    const rnd = seededRandom(707);
    for (let i = 0; i < 20; i++) {
      ctx.beginPath();
      ctx.arc(rnd() * w, rnd() * h, rnd() * 25 + 5, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(100,30,10,${rnd() * 0.2 + 0.08})`;
      ctx.fill();
    }
  });
}

function jupiterTexture() {
  return createCanvasTexture(1024, 512, (ctx, w, h) => {
    // banding
    for (let y = 0; y < h; y++) {
      const band = Math.sin(y * 0.04) * 0.5 + 0.5;
      const r = 180 + band * 50;
      const g = 130 + band * 40;
      const b = 80  + band * 20;
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.fillRect(0, y, w, 1);
    }
    // Great Red Spot
    const rnd = seededRandom(888);
    ctx.fillStyle = 'rgba(200,80,40,0.7)';
    ctx.beginPath();
    ctx.ellipse(w * 0.62, h * 0.58, 30, 18, 0.15, 0, Math.PI * 2);
    ctx.fill();
    // turbulence
    for (let i = 0; i < 400; i++) {
      const x = rnd() * w, y = rnd() * h;
      ctx.fillStyle = `rgba(${rnd() > 0.5 ? 220 : 140},${rnd() > 0.5 ? 170 : 90},60,${rnd() * 0.1})`;
      ctx.fillRect(x, y, rnd() * 15 + 2, rnd() * 3 + 1);
    }
  });
}

function saturnTexture() {
  return createCanvasTexture(1024, 512, (ctx, w, h) => {
    for (let y = 0; y < h; y++) {
      const band = Math.sin(y * 0.05) * 0.5 + 0.5;
      const r = 220 + band * 25;
      const g = 200 + band * 20;
      const b = 150 + band * 30;
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.fillRect(0, y, w, 1);
    }
    const rnd = seededRandom(666);
    for (let i = 0; i < 150; i++) {
      ctx.fillStyle = `rgba(200,180,130,${rnd() * 0.08})`;
      ctx.fillRect(rnd() * w, rnd() * h, rnd() * 20, rnd() * 2 + 0.5);
    }
  });
}

function saturnRingTexture() {
  return createCanvasTexture(1024, 64, (ctx, w, h) => {
    const rnd = seededRandom(333);
    for (let x = 0; x < w; x++) {
      const t = x / w;
      // gaps (Cassini division etc.)
      const gap1 = Math.exp(-Math.pow((t - 0.42) * 20, 2)) * 0.85;
      const gap2 = Math.exp(-Math.pow((t - 0.65) * 25, 2)) * 0.9;
      const alpha = Math.max(0, (1 - t * 0.3) * 0.75 - gap1 - gap2);
      const r = 200 + t * 40 + (rnd() - 0.5) * 20;
      const g = 185 + t * 30 + (rnd() - 0.5) * 15;
      const b = 140 + t * 20 + (rnd() - 0.5) * 15;
      ctx.fillStyle = `rgba(${r|0},${g|0},${b|0},${alpha})`;
      ctx.fillRect(x, 0, 1, h);
    }
  });
}

function uranusTexture() {
  return createCanvasTexture(512, 256, (ctx, w, h) => {
    for (let y = 0; y < h; y++) {
      const band = Math.sin(y * 0.06) * 0.5 + 0.5;
      const r = 120 + band * 20;
      const g = 200 + band * 15;
      const b = 227 + band * 10;
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.fillRect(0, y, w, 1);
    }
  });
}

function neptuneTexture() {
  return createCanvasTexture(512, 256, (ctx, w, h) => {
    for (let y = 0; y < h; y++) {
      const band = Math.sin(y * 0.07) * 0.5 + 0.5;
      const r = 45  + band * 25;
      const g = 70  + band * 30;
      const b = 210 + band * 30;
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.fillRect(0, y, w, 1);
    }
    // dark spot
    ctx.fillStyle = 'rgba(20,30,100,0.4)';
    ctx.beginPath();
    ctx.ellipse(w * 0.55, h * 0.45, 22, 14, 0.1, 0, Math.PI * 2);
    ctx.fill();
  });
}

// ── Sun ───────────────────────────────────────────────────────────────────────
function sunTexture() {
  return createCanvasTexture(1024, 512, (ctx, w, h) => {
    noise(ctx, w, h, 255, 200, 80, 255, 1001);
    // solar granulation
    const rnd = seededRandom(2002);
    for (let i = 0; i < 500; i++) {
      ctx.fillStyle = `rgba(255,${160 + rnd() * 80 | 0},${40 + rnd() * 50 | 0},${rnd() * 0.2})`;
      ctx.beginPath();
      ctx.arc(rnd() * w, rnd() * h, rnd() * 12 + 2, 0, Math.PI * 2);
      ctx.fill();
    }
  });
}

const sunGeo = new THREE.SphereGeometry(5, 64, 32);
const sunMat = new THREE.MeshBasicMaterial({ map: sunTexture() });
const sun = new THREE.Mesh(sunGeo, sunMat);
sun.name = 'sun';
scene.add(sun);

// sun glow sprite
const glowTex = createCanvasTexture(256, 256, (ctx, w, h) => {
  const grad = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  grad.addColorStop(0,   'rgba(255,240,200,0.45)');
  grad.addColorStop(0.2, 'rgba(255,180,80, 0.18)');
  grad.addColorStop(0.5, 'rgba(255,140,40, 0.06)');
  grad.addColorStop(1,   'rgba(255,100,20, 0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);
});
const glowSprite = new THREE.Sprite(
  new THREE.SpriteMaterial({ map: glowTex, transparent: true, blending: THREE.AdditiveBlending })
);
glowSprite.scale.set(25, 25, 1);
scene.add(glowSprite);

// ── Starfield ─────────────────────────────────────────────────────────────────
(() => {
  const COUNT = 12000;
  const positions = new Float32Array(COUNT * 3);
  const colors    = new Float32Array(COUNT * 3);
  const sizes     = new Float32Array(COUNT);
  const rnd = seededRandom(7777);

  for (let i = 0; i < COUNT; i++) {
    // random point on a sphere shell (radius 300–1000)
    const theta = rnd() * Math.PI * 2;
    const phi   = Math.acos(2 * rnd() - 1);
    const r     = 300 + rnd() * 700;
    positions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i * 3 + 2] = r * Math.cos(phi);

    // color temperature: 80% white, 10% warm, 10% cool
    const t = rnd();
    let cr, cg, cb;
    if (t < 0.1) {
      // warm
      cr = 1; cg = 0.85 + rnd() * 0.1; cb = 0.65 + rnd() * 0.15;
    } else if (t < 0.2) {
      // cool
      cr = 0.65 + rnd() * 0.15; cg = 0.8 + rnd() * 0.1; cb = 1;
    } else {
      // white
      const v = 0.85 + rnd() * 0.15;
      cr = v; cg = v; cb = v;
    }
    colors[i * 3] = cr;
    colors[i * 3 + 1] = cg;
    colors[i * 3 + 2] = cb;

    sizes[i] = rnd() * 1.2 + 0.3;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(colors, 3));
  geo.setAttribute('size',     new THREE.BufferAttribute(sizes, 1));

  const mat = new THREE.PointsMaterial({
    size: 1.0,
    vertexColors: true,
    transparent: true,
    opacity: 0.9,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    sizeAttenuation: true
  });

  scene.add(new THREE.Points(geo, mat));
})();

  const d = planet.userData;
  infoPanelEl.innerHTML = '';
  infoPanelEl.appendChild(closeBtn);

  const title = document.createElement('div');
  title.style.cssText = 'font-size:18px; font-weight:700; color:#7ab4ff; margin-bottom:10px;';
  title.textContent = d.name;
  infoPanelEl.appendChild(title);

  const desc = document.createElement('div');
  desc.style.cssText = 'color:#b0c4de; margin-bottom:14px; font-size:12.5px;';
  desc.textContent = d.description;
  infoPanelEl.appendChild(desc);

  const rows = [
    ['Mass', d.mass],
    ['Diameter', d.diameter],
    ['Temperature', d.temperature],
    ['Surface Gravity', d.gravity],
    ['Moons', d.moons],
    ['Day Length', d.dayLength],
    ['Distance from Sun', d.distAu],
    ['Orbital Period', d.orbitDays],
    ['Axial Tilt', `${d.tilt}°`],
    ['Eccentricity', d.eccentricity]
  ];

  rows.forEach(([label, val]) => {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid rgba(100,160,255,0.08);';
    row.innerHTML = `<span style="color:#6090bb;">${label}</span><span style="color:#d0e0f5;">${val}</span>`;
    infoPanelEl.appendChild(row);
  });

  infoPanelEl.style.display = 'block';
}

PLANET_DATA.forEach(d => {
  // Planet group (orbital pivot)
  const pivot = new THREE.Object3D();

  // Planet mesh
  const tex = textureMap[d.id]();
  const geo = new THREE.SphereGeometry(d.size, 64, 32);
  const mat = new THREE.MeshStandardMaterial({
    map: tex,
    roughness: 0.85,
    metalness: 0.05

  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.x = d.distance;
  mesh.rotation.z = THREE.MathUtils.degToRad(d.tilt);
  mesh.userData = { ...d };
  pivot.add(mesh);

  // Orbit line
  const orbitGeo = new THREE.BufferGeometry();
  const orbitPts = [];
  const segments = 200;
  for (let i = 0; i <= segments; i++) {
    const angle = (i / segments) * Math.PI * 2;
    const r = d.distance * (1 - d.eccentricity * d.eccentricity) /
              (1 + d.eccentricity * Math.cos(angle));
    const inc = THREE.MathUtils.degToRad(d.inclination);
    orbitPts.push(
      Math.cos(angle) * r,
      Math.sin(angle) * Math.sin(inc) * r * 0.3,
      Math.sin(angle) * Math.cos(inc) * r
    );
  }
  orbitGeo.setAttribute('position', new THREE.Float32BufferAttribute(orbitPts, 3));
  const orbitLine = new THREE.Line(
    orbitGeo,
    new THREE.LineBasicMaterial({ color: 0x334466, transparent: true, opacity: 0.35 })
  );
  scene.add(orbitLine);
  orbitPaths.push(orbitLine);

  // Saturn rings
  if (d.id === 'saturn') {
    const ringTex = saturnRingTexture();
    const ringGeo = new THREE.RingGeometry(d.size * 1.3, d.size * 2.5, 128);
    const ringMat = new THREE.MeshBasicMaterial({
      map: ringTex,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.8
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = THREE.MathUtils.degToRad(87); // Saturn's rings are nearly perpendicular to its axial tilt
    ring.position.x = d.distance;
    pivot.add(ring);
  }

  // Planet name label (billboard sprite)
  const labelCanvas = document.createElement('canvas');
  labelCanvas.width = 256; labelCanvas.height = 64;
  const lctx = labelCanvas.getContext('2d');
  lctx.fillStyle = 'transparent'; lctx.fillRect(0, 0, 256, 64);
  lctx.font = 'bold 28px "Segoe UI",system-ui,sans-serif';
  lctx.textAlign = 'center';
  lctx.fillStyle = '#8ab8e8';
  lctx.fillText(d.name, 128, 40);
  const labelTex = new THREE.CanvasTexture(labelCanvas);
  const labelSprite = new THREE.Sprite(
    new THREE.SpriteMaterial({ map: labelTex, transparent: true, depthWrite: false })
  );
  labelSprite.scale.set(d.size * 3, d.size * 0.8, 1);
  labelSprite.position.set(d.distance, d.size * 2.2, 0);
  pivot.add(labelSprite);
  labelSprites[d.id] = labelSprite;

  planetMeshes.push(mesh);
});

// ── Earth's Moon ──────────────────────────────────────────────────────────────
const earthPivot = scene.children.find(c => {
  const m = c.children?.[0];
  return m?.userData?.id === 'earth';
});
const moonTex = createCanvasTexture(256, 128, (ctx, w, h) => {
  noise(ctx, w, h, 180, 175, 170, 255, 4444);
  const rnd = seededRandom(5555);
  for (let i = 0; i < 150; i++) {
    ctx.fillStyle = `rgba(120,115,110,${rnd() * 0.3 + 0.1})`;
    ctx.beginPath();
    ctx.arc(rnd() * w, rnd() * h, rnd() * 4 + 0.5, 0, Math.PI * 2);
    ctx.fill();
  }
});
const moonGeo = new THREE.SphereGeometry(0.4, 32, 16);
const moonMat = new THREE.MeshStandardMaterial({ map: moonTex, roughness: 0.9, metalness: 0.02 });
const moon = new THREE.Mesh(moonGeo, moonMat);
moon.name = 'moon';
earthPivot.add(moon);

// ── Speed Controls UI ─────────────────────────────────────────────────────────
const speedPanel = document.createElement('div');
speedPanel.style.cssText = `
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  display:flex; gap:10px; align-items:center;
  background:rgba(8,12,24,0.85); border:1px solid rgba(100,160,255,0.25);
  border-radius:10px; padding:10px 18px; z-index:100;
  font-family:'Segoe UI',system-ui,sans-serif; color:#90b0d0; font-size:13px;
  backdrop-filter:blur(6px);
`;
document.body.appendChild(speedPanel);

const speedBtns = [
  { label: '×0.25', val: 0.25 },
  { label: '×1',    val: 1 },
  { label: '×5',    val: 5 },
  { label: '×20',   val: 20 },
  { label: '×100',  val: 100 }
];

let timeScale = 1;
speedBtns.forEach(b => {
  const btn = document.createElement('div');
  btn.textContent = b.label;
  btn.style.cssText = `
    padding:5px 12px; border-radius:6px; cursor:pointer;
    background:rgba(60,100,160,0.2); border:1px solid rgba(100,160,255,0.15);
    transition:all 0.15s;
  `;
  btn.onmouseenter = () => { btn.style.background = 'rgba(80,130,200,0.35)'; };
  btn.onmouseleave = () => { btn.style.background = 'rgba(60,100,160,0.2)'; };
  btn.onclick = () => {
    timeScale = b.val;
    speedBtns.forEach(bb => {});
    document.querySelectorAll('#speed-panel-btn').forEach(el => {
      el.style.borderColor = el.dataset.val === String(b.val)
        ? 'rgba(120,180,255,0.7)' : 'rgba(100,160,255,0.15)';
    });
  };
  btn.id = 'speed-panel-btn';
  btn.dataset.val = String(b.val);
  if (b.val === 1) btn.style.borderColor = 'rgba(120,180,255,0.7)';
  speedPanel.appendChild(btn);
});

// ── Keyboard shortcuts ────────────────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  if (e.key === '1') timeScale = 0.25;
  if (e.key === '2') timeScale = 1;
  if (e.key === '3') timeScale = 5;
  if (e.key === '4') timeScale = 20;
  if (e.key === '5') timeScale = 100;
  if (e.key === 'Escape') { infoPanelEl.style.display = 'none'; selectedPlanet = null; }
  if (e.key === ' ') { e.preventDefault(); timeScale = timeScale === 0 ? 1 : 0; }
});

// ── Animation ─────────────────────────────────────────────────────────────────
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  const elapsed = clock.getElapsedTime() * timeScale;

  // Sun rotation
  sun.rotation.y += delta * 0.05 * timeScale;

  // Planets orbit and rotate
  planetMeshes.forEach(mesh => {
    const d = mesh.userData;
    // orbital angle from elapsed time
    const orbitalSpeed = (2 * Math.PI) / (d.orbitalPeriod * 0.1);
    const angle = elapsed * orbitalSpeed;

    // Kepler orbit (eccentricity)
    const r = d.distance * (1 - d.eccentricity * d.eccentricity) /
              (1 + d.eccentricity * Math.cos(angle));

    const inc = THREE.MathUtils.degToRad(d.inclination);
    mesh.position.x = Math.cos(angle) * r;
    mesh.position.z = Math.sin(angle) * Math.cos(inc) * r;
    mesh.position.y = Math.sin(angle) * Math.sin(inc) * r * 0.3;

    // axial rotation
    const rotSpeed = (2 * Math.PI) / (Math.abs(d.rotationPeriod) * 10);
    const rotDir = d.rotationPeriod < 0 ? -1 : 1;
    mesh.rotation.y += delta * rotSpeed * rotDir * timeScale;

    // update Saturn ring position
    if (d.id === 'saturn') {
      const pivot = mesh.parent;
      const ring = pivot.children.find(c => c.geometry instanceof THREE.RingGeometry);
      if (ring) {
        ring.position.x = mesh.position.x;
        ring.position.y = mesh.position.y;
        ring.position.z = mesh.position.z;
      }
    }
  });

  // Moon orbit around Earth
  if (earthPivot) {
    const earthMesh = earthPivot.children.find(c => c.userData?.id === 'earth');
    if (earthMesh) {
      const moonAngle = elapsed * 1.3;
      const moonR = 2.8;
      moon.position.x = earthMesh.position.x + Math.cos(moonAngle) * moonR;
      moon.position.z = earthMesh.position.z + Math.sin(moonAngle) * moonR * 0.6;
      moon.position.y = earthMesh.position.y + Math.sin(moonAngle * 0.5) * 0.3;
    }
  }

  // Raycast hover / click
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(planetMeshes);
  document.body.style.cursor = intersects.length ? 'pointer' : 'default';

  controls.update();
  composer.render();
}

// ── Mouse Interaction ─────────────────────────────────────────────────────────
window.addEventListener('mousemove', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
});

window.addEventListener('click', (e) => {
  // Ignore clicks on UI
  if (e.target.closest('#info-panel') || e.target.closest('[style*="bottom:20px"]')) return;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(planetMeshes);
  if (intersects.length) {
    selectedPlanet = intersects[0].object;
    showInfo(selectedPlanet);
  } else {
    infoPanelEl.style.display = 'none';
    selectedPlanet = null;
  }
});

// ── Resize ────────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

// ── Instructions Overlay ──────────────────────────────────────────────────────
const helpEl = document.createElement('div');
helpEl.style.cssText = `
  position:fixed; bottom:70px; left:50%; transform:translateX(-50%);
  color:rgba(130,170,210,0.5); font-family:'Segoe UI',system-ui,sans-serif;
  font-size:11.5px; z-index:90; pointer-events:none; text-align:center;
  transition:opacity 0.5s;
`;
helpEl.innerHTML = 'Click a planet for details &nbsp;•&nbsp; Drag to orbit &nbsp;•&nbsp; Scroll to zoom &nbsp;•&nbsp; Space to pause &nbsp;•&nbsp; 1-5 to change speed';
document.body.appendChild(helpEl);
setTimeout(() => { helpEl.style.opacity = '0'; }, 8000);

// ── Start ─────────────────────────────────────────────────────────────────────
animate();
</script>
</body>
</html>
