<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Solar System - Interactive Three.js Simulation</title>
<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0a0e1a;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #fff;
  }

  /* ---- 3D canvas background ---- */
  #bg-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }

  /* ---- Overlaid content ---- */
  .overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    overflow-y: auto;
    padding: 1.5rem;
  }

  .overlay > * {
    pointer-events: auto;
  }

  /* ---- Hero block ---- */
  .hero {
    text-align: center;
    margin-bottom: 2.5rem;
    animation: fadeUp 1s ease forwards;
  }

  .hero-title {
    font-size: clamp(2.4rem, 10vw, 4.8rem);
    font-weight: 800;
    line-height: 1.1;
    background: linear-gradient(135deg, #6a89ff 0%, #b07aff 40%, #f472b6 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: 0 0 60px rgba(106, 137, 255, 0.25);
    letter-spacing: -0.02em;
    margin-bottom: 0.5rem;
  }

  .hero-sub {
    font-size: clamp(0.95rem, 2.5vw, 1.3rem);
    color: rgba(255, 255, 255, 0.6);
    font-weight: 400;
    margin-bottom: 2rem;
    text-shadow: 0 0 20px rgba(0, 0, 0, 0.7);
  }

  .cta-btn {
    display: inline-block;
    padding: 0.85rem 2.4rem;
    font-size: 1.1rem;
    font-weight: 600;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    text-decoration: none;
    color: #fff;
    background: linear-gradient(135deg, #6a89ff, #b07aff);
    box-shadow: 0 4px 30px rgba(106, 137, 255, 0.35);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    letter-spacing: 0.01em;
  }

  .cta-btn:hover {
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 8px 45px rgba(106, 137, 255, 0.5);
  }

  .cta-btn:active {
    transform: scale(0.97);
  }

  /* ---- Feature cards ---- */
  .features {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1rem;
    max-width: 780px;
    width: 100%;
    margin-bottom: 2rem;
    animation: fadeUp 1s ease 0.15s both;
  }

  .feature-card {
    background: rgba(255, 255, 255, 0.04);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 14px;
    padding: 1.1rem 0.6rem;
    text-align: center;
    transition: background 0.25s ease, transform 0.25s ease, border-color 0.25s ease;
  }

  .feature-card:hover {
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(106, 137, 255, 0.3);
    transform: translateY(-3px);
  }

  .feature-icon {
    font-size: 1.6rem;
    margin-bottom: 0.35rem;
    display: block;
  }

  .feature-label {
    font-size: 0.8rem;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.8);
    text-shadow: 0 0 10px rgba(0, 0, 0, 0.7);
  }

  /* ---- Tech stack ---- */
  .tech-section {
    text-align: center;
    margin-bottom: 1.2rem;
    animation: fadeUp 1s ease 0.3s both;
  }

  .tech-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: rgba(255, 255, 255, 0.3);
    margin-bottom: 0.6rem;
  }

  .tech-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    justify-content: center;
  }

  .badge {
    padding: 0.3rem 0.8rem;
    font-size: 0.72rem;
    font-weight: 600;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.09);
    color: rgba(255, 255, 255, 0.7);
    text-shadow: 0 0 8px rgba(0, 0, 0, 0.6);
  }

  .badge-threejs {
    background: rgba(106, 137, 255, 0.12);
    border-color: rgba(106, 137, 255, 0.2);
    color: #8aa3ff;
  }

  .badge-webgl {
    background: rgba(176, 122, 255, 0.12);
    border-color: rgba(176, 122, 255, 0.2);
    color: #c49fff;
  }

  .badge-esm {
    background: rgba(244, 114, 182, 0.12);
    border-color: rgba(244, 114, 182, 0.2);
    color: #f9a8d4;
  }

  .badge-canvas {
    background: rgba(52, 211, 153, 0.12);
    border-color: rgba(52, 211, 153, 0.2);
    color: #6ee7b7;
  }

  /* ---- Footer ---- */
  .footer {
    text-align: center;
    animation: fadeUp 1s ease 0.45s both;
  }

  .footer a {
    color: rgba(255, 255, 255, 0.35);
    text-decoration: none;
    font-size: 0.8rem;
    transition: color 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
  }

  .footer a:hover {
    color: rgba(255, 255, 255, 0.7);
  }

  .footer svg {
    width: 16px;
    height: 16px;
    fill: currentColor;
  }

  /* ---- Animations ---- */
  @keyframes fadeUp {
    from {
      opacity: 0;
      transform: translateY(24px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* ---- Responsive ---- */
  @media (max-width: 700px) {
    .features {
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
    }
  }

  @media (max-width: 420px) {
    .overlay {
      padding: 1rem;
    }
    .hero {
      margin-bottom: 1.5rem;
    }
    .features {
      gap: 0.5rem;
    }
    .feature-card {
      padding: 0.8rem 0.4rem;
    }
    .feature-icon {
      font-size: 1.2rem;
    }
    .feature-label {
      font-size: 0.7rem;
    }
    .cta-btn {
      padding: 0.7rem 1.6rem;
      font-size: 0.95rem;
    }
    .tech-badges {
      gap: 0.35rem;
    }
    .badge {
      padding: 0.25rem 0.6rem;
      font-size: 0.65rem;
    }
  }

  @media (max-width: 320px) {
    .hero-title {
      font-size: 1.8rem;
    }
    .hero-sub {
      font-size: 0.8rem;
    }
    .feature-card {
      padding: 0.6rem 0.3rem;
    }
    .feature-label {
      font-size: 0.6rem;
    }
  }
</style>
</head>
<body>

<!-- Three.js canvas -->
<div id="bg-canvas"></div>

<!-- Overlaid content -->
<div class="overlay">

  <div class="hero">
    <h1 class="hero-title">3D Solar System</h1>
    <p class="hero-sub">An interactive Three.js simulation</p>
    <a class="cta-btn" href="simulation.html">Launch Simulation &rarr;</a>
  </div>

  <div class="features">
    <div class="feature-card">
      <span class="feature-icon">&#9790;</span>
      <span class="feature-label">8 Planets</span>
    </div>
    <div class="feature-card">
      <span class="feature-icon">&#127912;</span>
      <span class="feature-label">Procedural Textures</span>
    </div>
    <div class="feature-card">
      <span class="feature-icon">&#10024;</span>
      <span class="feature-label">Bloom Effects</span>
    </div>
    <div class="feature-card">
      <span class="feature-icon">&#9851;</span>
      <span class="feature-label">Interactive</span>
    </div>
  </div>

  <div class="tech-section">
    <div class="tech-label">Tech Stack</div>
    <div class="tech-badges">
      <span class="badge badge-threejs">Three.js</span>
      <span class="badge badge-webgl">WebGL</span>
      <span class="badge badge-esm">ES Modules</span>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ----------------------------------------------------------------
// Setup
// ----------------------------------------------------------------
const container = document.getElementById('bg-canvas');
const w = container.clientWidth;
const h = container.clientHeight;

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(55, w / h, 0.1, 1000);
camera.position.set(0, 2, 12);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(w, h);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x0a0e1a);
container.appendChild(renderer.domElement);

// ----------------------------------------------------------------
// Procedural canvas textures
// ----------------------------------------------------------------
function makeGlowTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, 'rgba(255,220,180,1)');
  g.addColorStop(0.15, 'rgba(255,200,120,0.9)');
  g.addColorStop(0.4, 'rgba(255,160,60,0.4)');
  g.addColorStop(0.7, 'rgba(200,100,20,0.1)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
}

// ----------------------------------------------------------------
// Sun
// ----------------------------------------------------------------
const sunGeo = new THREE.SphereGeometry(0.7, 32, 32);
const sunMat = new THREE.MeshBasicMaterial({ color: 0xffaa44 });
const sun = new THREE.Mesh(sunGeo, sunMat);
scene.add(sun);
sun.userData = { rotSpeed: 0.001 };

// Sun glow sprite
const glowTex = makeGlowTexture();
const glowMat = new THREE.SpriteMaterial({
  map: glowTex,
  blending: THREE.AdditiveBlending,
  transparent: true,
  depthWrite: false,
  opacity: 0.85,
});
const glowSprite = new THREE.Sprite(glowMat);
glowSprite.scale.set(5, 5, 1);
sun.add(glowSprite);

// Point light from sun
const sunLight = new THREE.PointLight(0xffaa55, 2, 30);
sunLight.position.set(0, 0, 0);
scene.add(sunLight);

// Also ambient fill
const ambient = new THREE.AmbientLight(0x222244, 0.4);
scene.add(ambient);

// ----------------------------------------------------------------
// Planets
// ----------------------------------------------------------------
const PLANET_COLORS = [
  0x8ab8ff,  // ice blue
  0xf5deb3,  // wheat
  0x6b8e23,  // olive
  0xcd5c5c,  // indian red
  0xdaa520,  // goldenrod
  0x7b68ee,  // medium slate blue
  0x48d1cc,  // medium turquoise
  0xff69b4,  // hot pink
];

const PLANET_SIZES = [0.12, 0.16, 0.14, 0.13, 0.2, 0.18, 0.15, 0.11];
const PLANET_ORBITS = [1.6, 2.2, 2.9, 3.6, 4.4, 5.2, 6.0, 6.9];
const PLANET_SPEEDS = [0.6, 0.45, 0.38, 0.32, 0.25, 0.2, 0.17, 0.14];

const planets = [];

for (let i = 0; i < 8; i++) {
  const size = PLANET_SIZES[i];
  const radius = PLANET_ORBITS[i];
  const hue = (i / 8) * 0.8;

  // Procedural planet texture
  const pc = document.createElement('canvas');
  pc.width = pc.height = 64;
  const pctx = pc.getContext('2d');
  const gRad = pctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  const base = new THREE.Color(PLANET_COLORS[i]);
  const lighter = base.clone().multiplyScalar(1.4);
  const darker = base.clone().multiplyScalar(0.5);
  gRad.addColorStop(0, lighter.getStyle());
  gRad.addColorStop(0.5, base.getStyle());
  gRad.addColorStop(1, darker.getStyle());
  pctx.fillStyle = gRad;
  pctx.fillRect(0, 0, 64, 64);
  // Speckle
  for (let s = 0; s < 20; s++) {
    pctx.fillStyle = `rgba(255,255,255,${0.05 + Math.random() * 0.12})`;
    pctx.beginPath();
    pctx.arc(Math.random() * 64, Math.random() * 64, 1 + Math.random() * 2, 0, Math.PI * 2);
    pctx.fill();
  }
  const planetTex = new THREE.CanvasTexture(pc);

  const geo = new THREE.SphereGeometry(size, 16, 16);
  const mat = new THREE.MeshStandardMaterial({
    map: planetTex,
    roughness: 0.6,
    metalness: 0.1,
  });
  const mesh = new THREE.Mesh(geo, mat);
  scene.add(mesh);

  // Tiny ring for some planets
  if (i === 5 || i === 7) {
    const ringGeo = new THREE.RingGeometry(size * 1.3, size * 1.9, 32);
    const ringMat = new THREE.MeshBasicMaterial({
      color: PLANET_COLORS[i],
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.25,
      depthWrite: false,
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI * 0.4;
    ring.rotation.z = 0.3;
    mesh.add(ring);
  }

  const angle = Math.random() * Math.PI * 2;
  mesh.position.x = Math.cos(angle) * radius;
  mesh.position.z = Math.sin(angle) * radius;

  // random inclination
  mesh.position.y = (Math.random() - 0.5) * 0.3;

  planets.push({
    mesh,
    radius,
    speed: PLANET_SPEEDS[i],
    angle,
    inclination: mesh.position.y,
  });
}

// ----------------------------------------------------------------
// Orbital rings (decorative)
// ----------------------------------------------------------------
const ringRadii = [3.0, 4.8, 6.5];

ringRadii.forEach((r) => {
  const pts = [];
  const segs = 80;
  for (let i = 0; i <= segs; i++) {
    const theta = (i / segs) * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(theta) * r, 0, Math.sin(theta) * r));
  }
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineBasicMaterial({
    color: new THREE.Color().setHSL(0.62 + r * 0.02, 0.5, 0.25 + r * 0.03),
    transparent: true,
    opacity: 0.3,
  });
  const line = new THREE.Line(geo, mat);
  scene.add(line);
});

// ----------------------------------------------------------------
// Starfield
// ----------------------------------------------------------------
const STAR_COUNT = 3000;
const starPos = new Float32Array(STAR_COUNT * 3);
const starSizes = new Float32Array(STAR_COUNT);
const starColors = new Float32Array(STAR_COUNT * 3);

for (let i = 0; i < STAR_COUNT; i++) {
  const radius = 40 + Math.random() * 80;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);

  starPos[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
  starPos[i * 3 + 1] = radius * Math.cos(phi);
  starPos[i * 3 + 2] = radius * Math.sin(phi) * Math.sin(theta);

  starSizes[i] = 0.3 + Math.random() * 1.2;

  const temp = 0.5 + Math.random() * 0.5;
  const c = new THREE.Color().setHSL(0.1 - temp * 0.1, 0.3, 0.7 + temp * 0.3);
  starColors[i * 3] = c.r;
  starColors[i * 3 + 1] = c.g;
  starColors[i * 3 + 2] = c.b;
}

const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
starGeo.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));
starGeo.setAttribute('color', new THREE.BufferAttribute(starColors, 3));

// Procedural star sprite
const starCanvas = document.createElement('canvas');
starCanvas.width = starCanvas.height = 32;
const sctx = starCanvas.getContext('2d');
const sg = sctx.createRadialGradient(16, 16, 0, 16, 16, 16);
sg.addColorStop(0, 'rgba(255,255,255,1)');
sg.addColorStop(0.2, 'rgba(255,255,255,0.8)');
sg.addColorStop(0.6, 'rgba(200,200,255,0.2)');
sg.addColorStop(1, 'rgba(0,0,0,0)');
sctx.fillStyle = sg;
sctx.fillRect(0, 0, 32, 32);
const starTex = new THREE.CanvasTexture(starCanvas);

const starMat = new THREE.PointsMaterial({
  size: 0.3,
  map: starTex,
  blending: THREE.AdditiveBlending,
  transparent: true,
  depthWrite: false,
  vertexColors: true,
  sizeAttenuation: true,
});

const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

// ----------------------------------------------------------------
// Mouse / parallax state
// ----------------------------------------------------------------
const mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };

document.addEventListener('mousemove', (e) => {
  mouse.targetX = (e.clientX / window.innerWidth - 0.5) * 2;
  mouse.targetY = (e.clientY / window.innerHeight - 0.5) * 2;
});

document.addEventListener('touchmove', (e) => {
  if (e.touches.length === 1) {
    const t = e.touches[0];
    mouse.targetX = (t.clientX / window.innerWidth - 0.5) * 2;
    mouse.targetY = (t.clientY / window.innerHeight - 0.5) * 2;
  }
}, { passive: true });

// ----------------------------------------------------------------
// Resize
// ----------------------------------------------------------------
function onResize() {
  const w2 = container.clientWidth;
  const h2 = container.clientHeight;
  camera.aspect = w2 / h2;
  camera.updateProjectionMatrix();
  renderer.setSize(w2, h2);
}
window.addEventListener('resize', onResize);

// ----------------------------------------------------------------
// Animation loop
// ----------------------------------------------------------------
function animate() {
  requestAnimationFrame(animate);

  // Smooth mouse follow
  mouse.x += (mouse.targetX - mouse.x) * 0.06;
  mouse.y += (mouse.targetY - mouse.y) * 0.06;

  // Auto-rotation + parallax
  const autoRotY = performance.now() * 0.00006;
  const groupRotY = autoRotY + mouse.x * 0.3;
  const groupRotX = mouse.y * 0.15;

  // We rotate the whole scene group by grouping relevant objects
  // Actually easier: rotate camera around origin
  camera.position.x = 12 * Math.sin(groupRotY) * Math.cos(groupRotX);
  camera.position.y = 3 + mouse.y * 1.2;
  camera.position.z = 12 * Math.cos(groupRotY) * Math.cos(groupRotX);
  camera.lookAt(0, 0, 0);

  // Rotate sun
  sun.rotation.y += 0.002;

  // Animate planets
  const now = performance.now() * 0.001;
  for (const p of planets) {
    p.angle = now * 0.3 * p.speed;
    p.mesh.position.x = Math.cos(p.angle) * p.radius;
    p.mesh.position.z = Math.sin(p.angle) * p.radius;
    p.mesh.position.y = p.inclination + Math.sin(now * p.speed * 2) * 0.05;
    p.mesh.rotation.y += 0.02;
  }

  // Stars slowly rotate
  stars.rotation.y += 0.0001;
  stars.rotation.x += 0.00003;

  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
